<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1280" height="720" fill="#0c0c0f"/>

  <!-- title -->
  <text x="100" y="118" fill="#ffffff" font-size="48" font-weight="800">Financing</text>
  <rect x="102" y="138" width="190" height="4" rx="2" fill="#3fa9f5"/>

  <!-- table container -->
  <rect x="100" y="196" width="1080" height="424" rx="16" fill="#101016" stroke="#2a2a33" stroke-width="1.5"/>

  <!-- column dividers -->
  <line x1="520" y1="196" x2="520" y2="620" stroke="#23232c" stroke-width="1"/>
  <line x1="840" y1="196" x2="840" y2="620" stroke="#23232c" stroke-width="1"/>

  <!-- header row -->
  <path d="M100 212 a16 16 0 0 1 16 -16 h1048 a16 16 0 0 1 16 16 v48 h-1080 z" fill="#1a1a22"/>
  <text x="124" y="247" fill="#9fb6c9" font-size="18" font-weight="700" letter-spacing="1">SERVICE</text>
  <text x="544" y="247" fill="#9fb6c9" font-size="18" font-weight="700" letter-spacing="1">USAGE</text>
  <text x="864" y="247" fill="#9fb6c9" font-size="18" font-weight="700" letter-spacing="1">COST</text>

  <!-- row separators -->
  <line x1="100" y1="260" x2="1180" y2="260" stroke="#23232c" stroke-width="1"/>
  <line x1="100" y1="332" x2="1180" y2="332" stroke="#1c1c24" stroke-width="1"/>
  <line x1="100" y1="404" x2="1180" y2="404" stroke="#1c1c24" stroke-width="1"/>
  <line x1="100" y1="476" x2="1180" y2="476" stroke="#1c1c24" stroke-width="1"/>
  <line x1="100" y1="548" x2="1180" y2="548" stroke="#2a2a33" stroke-width="1.5"/>

  <!-- Row 1 : Supabase -->
  <circle cx="120" cy="296" r="5" fill="#4ade80"/>
  <text x="140" y="303" fill="#ffffff" font-size="20" font-weight="600">Supabase</text>
  <text x="544" y="303" fill="#c4c9d2" font-size="18">Free Plan</text>
  <text x="864" y="303" fill="#4ade80" font-size="20" font-weight="600">$0</text>

  <!-- Row 2 : Vercel -->
  <circle cx="120" cy="368" r="5" fill="#4ade80"/>
  <text x="140" y="375" fill="#ffffff" font-size="20" font-weight="600">Vercel</text>
  <text x="544" y="375" fill="#c4c9d2" font-size="18">Free Plan</text>
  <text x="864" y="375" fill="#4ade80" font-size="20" font-weight="600">$0</text>

  <!-- Row 3 : DigitalOcean -->
  <circle cx="120" cy="440" r="5" fill="#f2a93b"/>
  <text x="140" y="447" fill="#ffffff" font-size="20" font-weight="600">DigitalOcean Server</text>
  <text x="544" y="447" fill="#c4c9d2" font-size="18">Monthly Plan</text>
  <text x="864" y="447" fill="#f2c878" font-size="20" font-weight="600">$18.00 <tspan fill="#7d8794" font-size="15" font-weight="400">/ month</tspan></text>

  <!-- Row 4 : AWS -->
  <circle cx="120" cy="506" r="5" fill="#f2a93b"/>
  <text x="140" y="507" fill="#ffffff" font-size="20" font-weight="600">AWS</text>
  <text x="140" y="531" fill="#7d8794" font-size="14">$100 initial credit given</text>
  <text x="544" y="519" fill="#c4c9d2" font-size="18">Pay per usage</text>
  <text x="864" y="519" fill="#f2c878" font-size="20" font-weight="600">~$10.00 <tspan fill="#7d8794" font-size="15" font-weight="400">/ month</tspan></text>

  <!-- Total row -->
  <text x="140" y="591" fill="#9fb6c9" font-size="20" font-weight="700">Estimated total</text>
  <text x="544" y="591" fill="#7d8794" font-size="16">running cost</text>
  <text x="864" y="591" fill="#3fa9f5" font-size="24" font-weight="800">~$28 <tspan fill="#7d8794" font-size="16" font-weight="400">/ month</tspan></text>

  <!-- footnote -->
  <text x="100" y="664" fill="#5f6670" font-size="15">Hosting kept near-zero on free tiers; only the honeypot server and AWS usage carry recurring cost.</text>
</svg>
