services:
  db:
    image: postgres:16
    container_name: honeypot-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: honeypot
    ports:
      - "5432:5432"

  api:
    build: .
    container_name: honeypot-api
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    restart: always