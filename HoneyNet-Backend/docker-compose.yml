version: "3.9"

services:

  db:
    image: postgres:16
    container_name: honeypot-db
    restart: always

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data


  api:
    build: .
    container_name: honeypot-api
    depends_on:
      - db

    env_file:
      - .env

    ports:
      - "8000:8000"

    restart: always


volumes:
  pgdata: